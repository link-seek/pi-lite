name: ai-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: probe free workers-ai models
        env:
          CF_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
        run: |
          for m in "@cf/meta/llama-3.1-8b-instruct-fp8" "@cf/meta/llama-3.2-3b-instruct" "@cf/qwen/qwen2.5-coder-32b-instruct"; do
            echo "== $m"
            curl -s --max-time 60 -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/47ce24ced58f17c9fb15351adcbe67d4/ai/run/$m" \
              --data '{"messages":[{"role":"user","content":"Reply with exactly: FREE_MODEL_OK"}]}' | head -c 300
            echo
          done
