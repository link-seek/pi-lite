name: hdr-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: probe x-opencode-session values
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          body='{"model":"muse-spark-1.3-contributor","messages":[{"role":"user","content":"hi"}],"max_tokens":8}'
          for h in "NONE" "gateway-default-v1" "123e4567-e89b-12d3-a456-426614174000"; do
            echo "== header: $h"
            if [ "$h" = "NONE" ]; then
              curl -s --max-time 30 -X POST -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "$body" \
                "https://opencode.ai/inference/go/openai/v1/chat/completions" | head -c 250
            else
              curl -s --max-time 30 -X POST -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -H "x-opencode-session: $h" -d "$body" \
                "https://opencode.ai/inference/go/openai/v1/chat/completions" | head -c 250
            fi
            echo
          done
