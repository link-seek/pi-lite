name: deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PARENT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 47ce24ced58f17c9fb15351adcbe67d4
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec wrangler deploy
      - name: smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/smoke.json -w "%{http_code}" --max-time 20 https://pi-lite.delicate-dawn-probe.workers.dev/api/session) && break || sleep 10
          done
          echo "http=$code"; cat /tmp/smoke.json
          test "$code" = "200"
